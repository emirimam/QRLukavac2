<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lukavac Info · Digitalna info staza</title>
<meta name="description" content="Digitalna info staza Lukavca: QR kodovi na info tablama otvaraju mapu, priče i audio vodič. Projekat Udruženja mladih StartITi, na poziv Turističke zajednice Lukavac.">
<meta name="theme-color" content="#123b34">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/home.css">
<script>
  // stari oblik adrese (?l=vila) vodi direktno na stranicu lokacije
  (function () { var l = new URLSearchParams(location.search).get("l"); if (l && /^[a-z0-9-]+$/.test(l)) location.replace("/" + l); })();
</script>
</head>
<body class="home">
  <header class="h-hero">
    <div class="langs" id="langs" role="group" aria-label="Jezik / Language"></div>
    <div class="h-hero-in">
      <div class="h-eyebrow" data-h="eyebrow"></div>
      <h1 data-h="title"></h1>
      <p class="h-lead" data-h="lead"></p>
      <a class="h-cta" href="#mjesta" data-h="cta"></a>
    </div>
  </header>

  <main>
    <section class="h-sec h-map-sec" aria-labelledby="mapTitle">
      <h2 id="mapTitle" data-h="mapTitle"></h2>
      <p class="h-sub" data-h="mapSub"></p>
      <div id="homeMap" class="h-map" aria-label="Mapa info tačaka"></div>
    </section>

    <section class="h-sec" id="mjesta" aria-labelledby="placesTitle">
      <h2 id="placesTitle" data-h="placesTitle"></h2>
      <div id="places" class="h-places"><p class="h-sub">…</p></div>
    </section>

    <section class="h-sec" aria-labelledby="howTitle">
      <h2 id="howTitle" data-h="howTitle"></h2>
      <ol class="h-steps" id="steps"></ol>
    </section>

    <section class="h-sec h-two">
      <div class="h-box">
        <h2 data-h="passTitle"></h2>
        <p data-h="passText"></p>
      </div>
      <div class="h-box">
        <h2 data-h="privTitle"></h2>
        <ul class="h-list" id="privacy"></ul>
      </div>
    </section>
  </main>

  <footer class="about h-about">
    <h2 data-h="aboutTitle"></h2>
    <p data-h="aboutText"></p>
    <p data-h="aboutText2"></p>
    <p class="credits">Mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · rute: OSRM / FOSSGIS</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="/home.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
